name: Vampire Dominion Blood Moon v3.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vampire-dominion-pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Test and deploy Blood Moon v3.1
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test calculator engine and UI
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify all local images
        run: python verify_icons.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Blood Moon Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor project
        shell: bash
        run: |
          mkdir -p android-build/www
          cat > android-build/package.json <<'EOF'
          {"name":"vampire-dominion-mobile","private":true,"version":"3.1.0","dependencies":{"@capacitor/core":"8.5.1"},"devDependencies":{"@capacitor/cli":"8.5.1","@capacitor/android":"8.5.1"}}
          EOF
          cat > android-build/capacitor.config.json <<'EOF'
          {"appId":"com.optimist.vampiredominion","appName":"Vampire Dominion","webDir":"www"}
          EOF
          cp index.html android-build/www/
          cp manifest.webmanifest sw.js android-build/www/
          cp -R assets data scripts android-build/www/
          cd android-build
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android-build/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vampire-dominion-blood-moon-v3.1-android
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
